name: Publish Helm chart to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'deployments/charts/guestcluster-quota-webhook/Chart.yaml'

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: deployments/charts/guestcluster-quota-webhook
  OCI_REGISTRY: ghcr.io/joeyloman/charts

jobs:
  publish-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Skip if the chart version did not change
        id: version
        run: |
          NEW_VERSION=$(awk '/^version:/ {print $2}' $CHART_PATH/Chart.yaml)
          OLD_VERSION=$(git show HEAD^:$CHART_PATH/Chart.yaml | awk '/^version:/ {print $2}')
          echo "new=$NEW_VERSION old=$OLD_VERSION"
          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.version.outputs.changed == 'true'
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push the chart as an OCI artifact
        if: steps.version.outputs.changed == 'true'
        run: |
          helm lint $CHART_PATH
          helm package $CHART_PATH
          helm push guestcluster-quota-webhook-*.tgz oci://$OCI_REGISTRY
