name: Publish Helm chart to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'deployments/charts/guestcluster-quota-webhook/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: deployments/charts/guestcluster-quota-webhook
  OCI_REGISTRY: ghcr.io/joeyloman/charts

jobs:
  publish-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether this chart version is already published
        id: published
        run: |
          VERSION=$(awk '/^version:/ {print $2}' $CHART_PATH/Chart.yaml)
          echo "version=$VERSION"
          if helm pull oci://$OCI_REGISTRY/guestcluster-quota-webhook --version "$VERSION" -d /tmp >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push the chart as an OCI artifact
        if: steps.published.outputs.already == 'false'
        run: |
          helm lint $CHART_PATH
          helm package $CHART_PATH
          helm push guestcluster-quota-webhook-*.tgz oci://$OCI_REGISTRY
